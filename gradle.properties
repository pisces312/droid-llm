org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# droid-llm toggles
# Skip :engine:genie native build when QAIRT is not configured
# droid.skipGenie=true
# Keep only the listed QNN HTP arch versions (comma separated, "v" prefix optional).
# Default (no flag): non-release variants keep v81 only (dev device SM8850 -> V81);
# the release variant keeps every arch the QAIRT SDK provides (~84 MB for V68-V81
# Skel/Stub) because it is the GitHub Release build.
# Uncomment / pass on the CLI to override every variant:
# CLI: gradlew :app:assembleDebug -Pdroid.qnnHtpVersions=81
# PowerShell splits on commas -> quote the arg: '-Pdroid.qnnHtpVersions=79,81'
# "all" = keep every arch.
# droid.qnnHtpVersions=all
# droid.qnnHtpVersions=79,81
# Optional path overrides (prefer OS env vars: MNN_ROOT, QAIRT_PATH)
# droid.qairtSdkRoot=/path/to/qairt
# droid.mnnRoot=/path/to/MNN
